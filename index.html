<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Country Information System</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        hr {
            margin: 20px 0;
        }
    </style>
    <script src="app.js"></script>
</head>
<body>
<div>
    <table id="personTable">
        <thead>
        <tr>
            <th scope="col">Volgnummer</th>
            <th scope="col">Voornaam</th>
            <th scope="col">Familienaam</th>
        </tr>
        </thead>
        <tbody>
        <!-- Rows will be populated by JavaScript -->
        </tbody>
    </table>
</div>
</body>
</html>
